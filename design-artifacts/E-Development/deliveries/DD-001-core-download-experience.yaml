delivery:
  id: "DD-001"
  name: "Core Download Experience"
  type: "user_flow"
  status: "ready"
  priority: "high"
  created_by: "wds-ux-expert (Freya)"
  created_at: "2026-07-27T00:00:00Z"
  updated_at: "2026-07-27T00:00:00Z"
  version: "1.0"

description: |
  The complete v1 experience for my-torrent: opening a torrent and watching it
  download (zero friction), inspecting a specific torrent's files/trackers/peers,
  configuring global defaults once, and glancing at aggregate status from the
  menu bar. This is the entire product scope for the first release — all 4
  scenarios from Phase 3/4 are included in a single delivery since this is a
  solo hobby project with one release, not a multi-team parallel-stream project.

user_value:
  problem: "Existing macOS torrent clients are either heavy and being deprecated (qBittorrent), light but inconvenient (Transmission), or confusing (others) — no lightweight, pleasant, native option exists."
  solution: "A minimalist native macOS torrent client: zero-friction add flow, a calm downloads list, depth-on-demand detail view, one-time global settings, and an unobtrusive menu-bar quick-access layer."
  success_criteria:
    - "Near-zero CPU/memory usage while idle (background/seeding, no active transfer)"
    - "Alex uses it daily in place of Transmission — no fixed evaluation date, judged by whether it genuinely sticks"
    - "Any real engagement after open-source release (GitHub issues, stars) counts as success"

